name: $bog_apps_app

permissions: write-all

on:
    workflow_dispatch:
    push:
    pull_request:
    delete:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: hyoo-ru/mam_build@master2
              with:
                  package: "bog/apps"
                  modules: 'app'

            # SEO/GEO: $mol рисует страницу скриптом, поэтому в отдаваемом HTML было
            # ноль текста — GPTBot, PerplexityBot и прочие JS не исполняют и видели
            # пустую страницу. Экшен поднимает бандл в Puppeteer, ждёт отрисовки и
            # кладёт снимок обратно в index.html, плюс генерирует sitemap.xml и
            # robots.txt. Скрипт web.js в снимке остаётся: он лежит РЯДОМ с корнем
            # приложения, а не внутри него — иначе $mol снёс бы его при старте и
            # выложилась бы мёртвая статика.
            # continue-on-error: сбой пререндера оставляет обычный SPA — деградация,
            # а не падение выкладки.
            - name: Prerender to static HTML (SEO)
              if: github.ref == 'refs/heads/main'
              continue-on-error: true
              uses: b-on-g/mol-prerender-action@main
              with:
                  folder: "bog/apps/app/-"
                  base-url: "https://b-on-g.github.io/apps/"
                  viewport: "1280x900"

            # llms.txt (llmstxt.org) — выжимка о бренде, услугах и кейсах простым
            # текстом, чтобы модели цитировали её вместо разбора вёрстки.
            # Копируем после пререндера, иначе его вывод затрёт файл.
            - name: Copy llms.txt
              if: github.ref == 'refs/heads/main'
              run: cp bog/apps/llms.txt bog/apps/app/-/llms.txt

            - uses: hyoo-ru/gh-deploy@v4.4.1
              if: github.ref == 'refs/heads/main'
              with:
                  folder: "bog/apps/app/-"

            - name: Deploy feature branch
              if: startsWith(github.ref, 'refs/heads/feature/')
              uses: hyoo-ru/gh-deploy@v4.4.1
              with:
                  folder: "bog/apps/-"
                  target-folder: ${{ github.ref_name }}

    cleanup:
        if: github.event_name == 'delete' && startsWith(github.event.ref, 'feature/')
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: gh-pages

            - name: Remove feature folder
              run: |
                  BRANCH_NAME="${{ github.event.ref }}"
                  FOLDER="feature/${BRANCH_NAME#feature/}"
                  if [ -d "$FOLDER" ]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git rm -rf "$FOLDER"
                    git commit -m "Clean up preview for deleted branch: $BRANCH_NAME"
                    git push
                  fi
